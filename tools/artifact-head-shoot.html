<title>Съёмочные сценарии Infinity Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#EDEFF0; --card:#FAFBFB; --card-2:#F3F5F6;
  --ink:#15191C; --ink-2:#454D53; --ink-3:#79838A;
  --rule:#D2D8DB; --rule-2:#E2E7E9;
  --mark:#B93A2E; --mark-soft:#F7E6E3;
  --chalk:#275B78; --chalk-soft:#E4EDF2;
  --good:#2C6B4E;
  --sans:"Golos Text",system-ui,"Segoe UI",sans-serif;
  --serif:"Literata",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131719; --card:#1A1F22; --card-2:#20262A;
    --ink:#E8ECEE; --ink-2:#A9B3B8; --ink-3:#7B858B;
    --rule:#2B3337; --rule-2:#232A2E;
    --mark:#E5776A; --mark-soft:#31201E;
    --chalk:#78ADCB; --chalk-soft:#1B282F;
    --good:#63A886;
  }
}
:root[data-theme="dark"]{
  --paper:#131719; --card:#1A1F22; --card-2:#20262A;
  --ink:#E8ECEE; --ink-2:#A9B3B8; --ink-3:#7B858B;
  --rule:#2B3337; --rule-2:#232A2E;
  --mark:#E5776A; --mark-soft:#31201E;
  --chalk:#78ADCB; --chalk-soft:#1B282F;
  --good:#63A886;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--serif); font-size:17px; line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 96px}
.layout{display:block}
@media(min-width:1080px){
  .layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:56px;align-items:start}
}

/* header */
header.top{padding:56px 0 40px;border-bottom:1px solid var(--rule)}
.eyebrow{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 22px
}
h1{
  font-family:var(--sans);font-weight:700;font-size:clamp(38px,6.2vw,66px);
  line-height:1.02;letter-spacing:-.025em;margin:0;text-wrap:balance;max-width:16ch
}
h1 em{font-style:normal;color:var(--mark)}
.stand{
  font-size:19px;color:var(--ink-2);max-width:56ch;margin:22px 0 0
}

/* nav */
nav.toc{display:none}
@media(min-width:1080px){
  nav.toc{display:block;position:sticky;top:32px;padding-top:44px}
  nav.toc ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
  nav.toc a{
    font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;
    color:var(--ink-3);text-decoration:none;display:flex;gap:9px;line-height:1.35
  }
  nav.toc a span{color:var(--mark);font-weight:500}
  nav.toc a:hover,nav.toc a:focus-visible{color:var(--ink)}
}

/* sections */
section{padding-top:60px}
h2{
  font-family:var(--sans);font-weight:700;font-size:clamp(25px,3.2vw,33px);
  letter-spacing:-.018em;line-height:1.14;margin:0 0 6px;text-wrap:balance
}
.sec-no{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mark);display:block;margin-bottom:12px
}
h3{
  font-family:var(--sans);font-weight:600;font-size:20px;letter-spacing:-.012em;
  margin:38px 0 10px;text-wrap:balance
}
p{margin:0 0 16px;max-width:68ch}
.lede{font-size:18.5px;color:var(--ink-2);max-width:64ch}
ul,ol{max-width:68ch;padding-left:20px;margin:0 0 18px}
li{margin-bottom:8px}
strong{font-weight:600}
a{color:var(--chalk)}

/* stats */
.stats{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:1px;background:var(--rule);border:1px solid var(--rule);margin:30px 0 34px
}
.stat{background:var(--card);padding:20px 18px}
.stat b{
  display:block;font-family:var(--sans);font-weight:700;font-size:30px;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1.1
}
.stat b.neg{color:var(--mark)}
.stat b.pos{color:var(--good)}
.stat span{
  display:block;font-family:var(--mono);font-size:11px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-3);margin-top:9px;line-height:1.5
}

/* callout */
.callout{
  border-left:3px solid var(--mark);background:var(--mark-soft);
  padding:20px 22px;margin:28px 0;border-radius:0 3px 3px 0
}
.callout p{margin:0;max-width:62ch}
.callout p+p{margin-top:12px}
.callout .lbl{
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--mark);display:block;margin-bottom:10px
}
blockquote{
  margin:20px 0;padding:18px 22px;background:var(--card);border:1px solid var(--rule);
  font-family:var(--sans);font-size:18px;font-weight:500;color:var(--ink)
}
blockquote p{margin:0;max-width:none}

/* tables */
.tw{overflow-x:auto;margin:26px 0 30px;border:1px solid var(--rule);background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:15px;font-family:var(--sans)}
th{
  text-align:left;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);padding:13px 16px;
  border-bottom:1px solid var(--rule);vertical-align:bottom;background:var(--card-2)
}
td{padding:13px 16px;border-bottom:1px solid var(--rule-2);vertical-align:top;color:var(--ink-2);line-height:1.5}
td:first-child{color:var(--ink);font-weight:500}
tr:last-child td{border-bottom:none}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.yes{color:var(--good);font-weight:600}
.no{color:var(--mark);font-weight:600}

/* phases */
.phase{
  border:1px solid var(--rule);background:var(--card);padding:26px 26px 8px;margin:22px 0;
  border-top:3px solid var(--chalk)
}
.phase.p1{border-top-color:var(--mark)}
.phase.p3{border-top-color:var(--good)}
.phase-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;margin-bottom:4px}
.phase-h h3{margin:0;font-size:22px}
.days{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)
}
.cols{display:grid;gap:26px;margin-top:20px}
@media(min-width:700px){.cols{grid-template-columns:1fr 1fr}}
.col h4{
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--rule)
}
.col ul{margin:0;padding-left:18px;font-family:var(--sans);font-size:15px;color:var(--ink-2)}

/* scenarios */
.sc{
  border:1px solid var(--rule);background:var(--card);margin:26px 0;
}
.sc-head{
  display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;
  padding:20px 24px;border-bottom:1px solid var(--rule);background:var(--card-2)
}
.sc-num{
  font-family:var(--mono);font-size:13px;font-weight:600;color:var(--mark);
  padding-top:4px;letter-spacing:.06em
}
.sc-head h3{margin:0;font-size:21px}
.sc-meta{
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);margin:7px 0 0;max-width:none
}
.sc-head > div{flex:1 1 240px}
.cover{
  font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink);
  border:1px dashed var(--rule);padding:7px 12px;align-self:center;white-space:nowrap
}
.cover i{
  font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);display:block;font-weight:400;margin-bottom:2px
}
.sc-body{padding:22px 24px 24px}
.hook{
  background:var(--chalk-soft);border-left:3px solid var(--chalk);padding:16px 18px;margin-bottom:22px
}
.hook p{
  margin:0;font-family:var(--sans);font-size:18px;font-weight:600;line-height:1.4;
  color:var(--ink);max-width:58ch
}
.lbl{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);display:block;margin-bottom:7px
}
.hook .lbl{color:var(--chalk)}
.field{margin-bottom:20px}
.field p{margin:0;font-size:16px;max-width:66ch}
.shots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.shots li{
  display:flex;gap:16px;padding:9px 0;border-bottom:1px solid var(--rule-2);
  font-family:var(--sans);font-size:15px;color:var(--ink-2);margin:0;line-height:1.5
}
.shots li:last-child{border-bottom:none}
.shots .t{
  font-family:var(--mono);font-size:12px;color:var(--mark);font-variant-numeric:tabular-nums;
  flex:0 0 62px;padding-top:2px;letter-spacing:-.01em
}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  font-family:var(--mono);font-size:12px;padding:5px 10px;background:var(--card-2);
  border:1px solid var(--rule);color:var(--ink-2)
}
.caption-box{
  background:var(--card-2);border:1px solid var(--rule);padding:16px 18px;
  font-size:16px;color:var(--ink);max-width:none
}
.caption-box p{margin:0;max-width:64ch}
.sc-foot{
  display:flex;flex-wrap:wrap;gap:22px;padding-top:18px;margin-top:4px;border-top:1px solid var(--rule)
}
.sc-foot div{flex:1 1 220px}
.sc-foot p{margin:0;font-family:var(--sans);font-size:14.5px;color:var(--ink-2);max-width:44ch}
.ask p{color:var(--mark)}
footer.end{
  margin-top:70px;padding-top:24px;border-top:1px solid var(--rule);
  font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--ink-3);line-height:1.7
}
:focus-visible{outline:2px solid var(--mark);outline-offset:3px}
@media (prefers-reduced-motion:no-preference){
  html{scroll-behavior:smooth}
}

h4{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:26px 0 10px}
ul.tight{margin:0;padding-left:18px;font-family:var(--sans);font-size:15px;color:var(--ink-2)}
ul.tight li{margin-bottom:5px}
.shots li span:last-child{flex:1}
code{font-family:var(--mono);font-size:13.5px;background:var(--card-2);border:1px solid var(--rule);padding:1px 5px}
.phase h3{font-family:var(--sans)}
.sc .field ul.tight{margin-top:2px}
nav.toc a{white-space:normal}
h1 strong{color:var(--mark);font-weight:700}
.stand strong{font-weight:600}

.shots li{align-items:flex-start}
.shots .what{flex:1}
.mode{
  flex:0 0 78px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding-top:3px
}
.mode.sync{color:var(--mark)}
.mode.vo{color:var(--chalk)}
.mode.mute{color:var(--ink-3)}
.mode.card{color:var(--good)}
@media(max-width:520px){.mode{flex-basis:64px}}

/* съёмочные карточки */
.spec{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);margin:18px 0 22px
}
.spec-i{background:var(--card-2);padding:11px 14px;display:flex;flex-direction:column;gap:4px}
.spec-l{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.spec-v{font-family:var(--sans);font-size:14.5px;color:var(--ink);line-height:1.4}
.take{border:1px solid var(--rule);border-left:3px solid var(--rule);background:var(--card);margin:14px 0}
.take-h{
  display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:11px 16px;
  background:var(--card-2);border-bottom:1px solid var(--rule)
}
.take-n{font-family:var(--sans);font-weight:700;font-size:15px;letter-spacing:-.01em}
.take-t{
  font-family:var(--mono);font-size:12px;color:var(--mark);font-variant-numeric:tabular-nums
}
.take-p{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)
}
.take-h .mode{flex:0 0 auto;margin-left:auto;padding-top:0}
.take-r{display:flex;gap:14px;padding:10px 16px;border-bottom:1px solid var(--rule-2)}
.take-r:last-child{border-bottom:none}
.take-l{
  flex:0 0 130px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);padding-top:3px
}
.take-v{flex:1;font-family:var(--sans);font-size:15px;line-height:1.55;color:var(--ink-2)}
.take-r.speech{background:var(--chalk-soft)}
.take-r.speech .take-l{color:var(--chalk)}
.take-r.speech .take-v{color:var(--ink);font-size:16.5px;font-weight:500;line-height:1.5}
@media(max-width:560px){
  .take-r{flex-direction:column;gap:5px}
  .take-l{flex:none}
}
h3{margin-top:44px;padding-top:14px;border-top:1px solid var(--rule)}
h3:first-of-type{border-top:none}
</style>
